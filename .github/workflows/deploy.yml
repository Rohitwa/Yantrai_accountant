name: Deploy to Cloud Run

# Pushes to main go straight to the service that serves yantrailabs.com.
# Use the "Run workflow" button to deploy any other branch by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: gen-lang-client-0024674990
  SERVICE: yantrai-website
  REGION: asia-south1

# One deploy at a time; a newer push supersedes one that is still queued.
concurrency:
  group: cloud-run-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # needed for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      # Without this the job dies inside google-github-actions/auth with
      # "must specify exactly one of workload_identity_provider or
      # credentials_json", which reads like a workflow bug rather than what it
      # is: nobody has put a credential in this repo yet. Every run of this
      # workflow has failed there, which is why deploys happen by hand.
      - name: Preflight - deploy credentials are configured
        env:
          WIF: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$WIF" ] && [ -z "$SA_KEY" ]; then
            echo "::error title=Deploy is not configured::This repo has no GCP credential, so main cannot deploy itself. Add the service-account JSON as the GCP_SA_KEY secret (Settings -> Secrets and variables -> Actions), or set the GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT variables for keyless auth. Until then, deploy from a checkout with scripts/deploy.sh."
            exit 1
          fi

      # public/ is what gets served; design/ is what it is built from. A change
      # to design/ that was never rebuilt would otherwise deploy the old HTML
      # with nothing failing.
      - name: Verify public/ matches design/
        run: scripts/check-build.sh

      # Two ways in. Set the GCP_WORKLOAD_IDENTITY_PROVIDER repo variable to use
      # keyless auth; leave it unset and the GCP_SA_KEY secret is used instead.
      - name: Authenticate (Workload Identity Federation)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Authenticate (service-account key)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # No --set-env-vars here on purpose: that flag replaces the service's
      # whole environment, which would drop the SMTP settings the form needs.
      # Deploying without it leaves the existing config untouched.
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --platform managed \
            --allow-unauthenticated \
            --quiet

      - name: Show the serving URL
        run: |
          gcloud run services describe "$SERVICE" \
            --region "$REGION" --project "$PROJECT_ID" \
            --format='value(status.url)'

      # Assume nothing: compare what the domain returns against the homepage in
      # this commit. CRLF is stripped from both sides, so a checkout that stores
      # the file with CRLF does not read as a mismatch.
      - name: Verify yantrailabs.com is serving this commit
        run: |
          sleep 15
          local_hash=$(tr -d '\r' < public/index.html | sha256sum | cut -d' ' -f1)
          live_hash=$(curl -fsSL https://yantrailabs.com/ | tr -d '\r' | sha256sum | cut -d' ' -f1)
          echo "commit  $GITHUB_SHA"
          echo "local   $local_hash"
          echo "live    $live_hash"
          if [ "$local_hash" != "$live_hash" ]; then
            echo "::warning title=Live site not yet matching::The domain is not serving this commit's homepage. A cache can lag by a minute; re-check before treating it as a failed deploy."
          fi
